<section class="panel" id="daily-reflection"><div class="section-heading"><div><p class="eyebrow">练完，再花两分钟回顾</p><h3>今天的复盘</h3></div></div>
<input id="reflection-date" type="hidden" value="{{ today }}">
<div class="reflection-columns"><div><h4>我自己的复盘</h4><label>今天哪里卡住了，明天准备怎么练？<textarea id="personal-reflection" data-saved-id="{{ reflection.user.id if reflection.user else '' }}" rows="6" placeholder="用自己的话记下来，几句话也可以。">{{ reflection.user.content if reflection.user else '' }}</textarea></label><button id="save-reflection">保存我的复盘</button><p id="personal-reflection-output" role="status"></p></div>
<div><h4>模型帮我回顾今天</h4><p class="muted">回顾今天练会的、卡住的和待评价的内容，给出明天的建议；个人复盘独立保留。</p><button id="generate-reflection">{{ '更新学习复盘' if reflection.model else '生成学习复盘' }}</button>{% if reflection.model and reflection.model.stale %}<p class="notice">有新的作答或评价，建议更新。</p>{% endif %}{% if reflection.model %}<button data-view-reflection="{{ reflection.model.id }}" data-output="model-reflection-content">查看上次学习复盘</button>{% endif %}<p id="model-reflection-output" role="status"></p><div id="model-reflection-content" class="prose">{{ '已保存上次复盘，点击查看。' if reflection.model else '练习并提交后，在这里生成复盘。' }}</div><p class="muted">复盘只总结学习情况，不展示标准答案；查看复盘不影响独立复习计数。</p></div></div></section><script src="{{ asset_url('reflections.js') }}"></script>
