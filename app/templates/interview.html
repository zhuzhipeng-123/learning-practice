{% extends "base.html" %}{% block title %}秋招练习{% endblock %}{% block content %}
<div class="page-heading"><div><h2>准备一场面试</h2><p class="muted">选一个方向开始，像聊天一样回答。面试官会追问不清楚的地方、检验薄弱点，也会转向相关的新考点。</p></div></div>
<section class="panel"><h3>直接从薄弱点开始</h3><button data-interview-pool="review">错题深挖 →</button><button data-interview-pool="classic">经典题练习 →</button><p class="muted">开场直接从本地题库随机抽取，因此很快；回答后的追问才调用模型。可在练习页把常考题标为经典；题池为空时会说明实际选题范围。</p><p id="pool-result" role="status"></p></section>
<section class="panel"><form id="interview-choice">
<label>练什么方向？<select id="interview-mode"><option value="custom">自己填写方向</option><option value="random">随机推荐方向</option></select></label>
<label>岗位与希望重点考察的内容（可选）<textarea id="job-focus" rows="2" maxlength="2000" placeholder="例如：大模型应用开发实习；留空也可以开始"></textarea></label>
<div id="random-directions" hidden><button type="button" id="suggest-directions">随机推荐三个方向</button><div id="direction-options" class="target-inputs"></div><p id="directions-status" role="status"></p><p class="muted">选一个感兴趣的方向，也可以在下面改写。</p></div>
<label>我的练习方向<textarea id="interview-direction" rows="3" maxlength="2000" required placeholder="例如：Agent 的工具调用与异常恢复；或我想练 RAG 的评估和优化"></textarea></label>
<button class="primary" type="submit">按这个方向开始面试</button><p id="interview-result" role="status"></p>
</form></section>
<script src="{{ asset_url('interview_setup.js') }}"></script>{% endblock %}
