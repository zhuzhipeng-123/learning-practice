<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · 学习练习</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#23352c;font:16px/1.75 "Segoe UI","Microsoft YaHei",sans-serif}header,main{max-width:800px;margin:auto;padding:24px}header{border-bottom:1px solid #e1e8e2;font-weight:600}main{padding-top:64px}article{padding:32px;background:white;border:1px solid #e1e8e2;border-radius:14px}h1{font-size:28px;line-height:1.4;margin:12px 0}p{overflow-wrap:anywhere}.status{color:#6b786f;font:14px Consolas,monospace}nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}a{display:inline-block;padding:10px 16px;border:1px solid #28644e;border-radius:7px;color:#28644e;text-decoration:none;min-height:44px}a:first-child{background:#28644e;color:white}a:focus-visible{outline:3px solid #81af94;outline-offset:3px}@media(max-width:480px){main{padding-top:28px}article{padding:22px}h1{font-size:24px}}
</style></head>
<body><header>学习练习</header><main><article aria-labelledby="error-title"><span class="status">HTTP {{ status }}</span><h1 id="error-title">{{ title }}</h1><p role="alert">{{ message }}</p><nav aria-label="恢复浏览"><a href="/">返回今天</a><a href="">重新打开这一页</a><a href="/review">前往复习库</a></nav></article></main></body>
</html>
